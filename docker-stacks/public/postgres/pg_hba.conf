# Who may connect to Postgres, and how. First matching line wins.
# Every network connection must use TLS ("hostssl"); plain TCP matches nothing.
# TYPE   DATABASE  USER      ADDRESS   METHOD

# Inside the container (healthcheck, init scripts).
local    all       all                 trust

# Other containers on the Docker network (pgAdmin, postgres-users).
hostssl  all       all       samenet   scram-sha-256

# The superuser never logs in from the internet; apps use their APP_USERS role.
host     all       postgres  all       reject

# Apps on any machine: TLS + password.
hostssl  all       all       all       scram-sha-256

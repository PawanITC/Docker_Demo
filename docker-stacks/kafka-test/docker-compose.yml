# Kafka smoke test: a producer that creates a topic and sends messages, and a
# consumer that prints them. Settings come from .env (copy .env.example).
#
#   docker compose build
#   docker compose run --rm producer     # create topic + send MESSAGE_COUNT messages
#   docker compose run --rm consumer     # print them (Ctrl+C to stop)
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-}
  KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_SSL}
  KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-512}
  KAFKA_USERNAME: ${KAFKA_USERNAME:-}
  KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
  KAFKA_TOPIC: ${KAFKA_TOPIC:-test-topic}

services:
  producer:
    build: ./producer
    image: stack/kafka-test-producer:1.0
    environment:
      <<: *kafka-env
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-3}
      TOPIC_REPLICATION: ${TOPIC_REPLICATION:-1}
      MESSAGE_COUNT: ${MESSAGE_COUNT:-10}
      MESSAGE_INTERVAL_SEC: ${MESSAGE_INTERVAL_SEC:-1}

  consumer:
    build: ./consumer
    image: stack/kafka-test-consumer:1.0
    environment:
      <<: *kafka-env
      GROUP_ID: ${GROUP_ID:-kafka-test}
      IDLE_TIMEOUT_SEC: ${IDLE_TIMEOUT_SEC:-0}

# Run:   docker compose up -d --build
# Open:  http://localhost:3000   (admin / admin)
services:
  grafana:
    build: .
    image: stack/grafana:11.2.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-data:
    name: stack_grafana-data

# Run:   docker compose up -d --build
# Open:  http://localhost:5000   (refresh → visits increase; recreate container → count is kept)
services:
  python-app:
    build: .
    image: stack/python-app:1.0
    ports:
      - "5000:5000"
    volumes:
      - python-data:/data
    restart: unless-stopped

volumes:
  python-data:
    name: stack_python-data
